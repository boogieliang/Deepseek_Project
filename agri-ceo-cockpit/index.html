<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>土地乐 · 农资 CEO 驾驶舱</title>
<style>
:root{
  --bg:#08120e; --panel:#0f1c16; --panel2:#13241c;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --text:#e9f2ec; --muted:#9cb8ab; --dim:#718e80;
  --green:#3ddc97; --green2:#1f9d68; --gold:#e8b559;
  --red:#f0605d; --blue:#57a9e6; --violet:#a58bfa;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(61,220,151,.13), transparent 62%),
    radial-gradient(760px 380px at 88% -12%, rgba(232,181,89,.10), transparent 60%),
    radial-gradient(700px 500px at 50% 110%, rgba(87,169,230,.06), transparent 65%);
}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:0 22px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(8,18,14,.94),rgba(8,18,14,.72));
  border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:11px;margin-right:6px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2ec98a,#0f7a52);box-shadow:0 4px 16px rgba(46,201,138,.28)}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.04em;line-height:1.2}
.brand p{font-size:9.5px;color:var(--dim);letter-spacing:.22em;text-transform:uppercase}
.spacer{flex:1}
.ctrl{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;
  padding:5px 12px;border-radius:7px;cursor:pointer;transition:.18s}
.seg button.on{background:rgba(61,220,151,.16);color:var(--green);box-shadow:inset 0 0 0 1px rgba(61,220,151,.3)}
select{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);
  font:inherit;font-size:12px;padding:7px 10px;border-radius:9px;outline:none;cursor:pointer}
select:focus{border-color:rgba(61,220,151,.4)}
.bell{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);display:grid;place-items:center;cursor:pointer}
.bell b{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9.5px;
  font-weight:600;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.live{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0 14px}
.kpi{position:relative;background:linear-gradient(170deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r);padding:14px 15px 12px;overflow:hidden;
  transition:transform .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--ac)}
.kpi-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi-l{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.kpi-v{font-size:25px;font-weight:640;letter-spacing:-.02em;margin:5px 0 1px;display:flex;align-items:baseline;gap:4px}
.kpi-v em{font-size:11.5px;font-weight:400;color:var(--muted);font-style:normal}
.kpi-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.kpi-n{font-size:10.5px;color:var(--dim)}
.chip{font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600;white-space:nowrap}
.up{color:var(--green);background:rgba(61,220,151,.13)}
.down{color:var(--red);background:rgba(240,96,93,.13)}
.flat{color:var(--muted);background:rgba(255,255,255,.06)}
.spark{display:block;width:100%;height:30px;margin-top:8px;opacity:.9}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:500;
  padding:10px 16px;cursor:pointer;position:relative;white-space:nowrap;transition:.18s}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text)}
.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--green),rgba(61,220,151,.2));border-radius:2px}

/* ---------- grid / cards ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}
.view{display:none}
.view.on{display:grid;align-items:start;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:linear-gradient(178deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px 14px;position:relative;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-t{font-size:13px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.card-t i{width:3px;height:12px;border-radius:2px;background:var(--green);display:inline-block}
.card-s{font-size:10.5px;color:var(--dim);font-weight:400}
.tag{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:5px;white-space:nowrap}
.foot{font-size:10.5px;color:var(--dim);margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot b{color:var(--muted);font-weight:500}
.src{display:flex;gap:5px;flex-wrap:wrap}
.src span{font-size:9.5px;color:var(--dim);background:rgba(255,255,255,.04);padding:1px 6px;border-radius:4px}
.note{border-left:2px solid var(--gold);background:rgba(232,181,89,.07);padding:7px 10px;border-radius:0 7px 7px 0;
  font-size:11.5px;color:#d9c9a6;margin-top:10px}
.note b{color:var(--gold)}

/* bars */
.hb{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:9px;margin-bottom:8px;font-size:11.5px}
.hb-n{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{height:7px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:4px;transition:width .6s}
.hb-v{font-variant-numeric:tabular-nums;font-weight:600;font-size:11px;color:var(--text);min-width:44px;text-align:right}

/* list */
.li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.li:last-child{border-bottom:0;padding-bottom:0}
.li-i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none;margin-top:1px}
.li-b{flex:1;min-width:0}
.li-t{font-size:12px;font-weight:550;color:#dfeae4;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.li-d{font-size:10.8px;color:var(--dim);margin-top:2px;line-height:1.5}
.li-v{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}

/* table */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:10.5px;padding:0 8px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,.04);color:#cfdcd5;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(61,220,151,.04)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;display:inline-block}
.p-g{color:var(--green);background:rgba(61,220,151,.12)}
.p-y{color:var(--gold);background:rgba(232,181,89,.13)}
.p-r{color:var(--red);background:rgba(240,96,93,.13)}
.p-b{color:var(--blue);background:rgba(87,169,230,.13)}
.p-m{color:var(--muted);background:rgba(255,255,255,.06)}

/* funnel */
.fn{margin-top:2px}
.fn-row{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;margin-bottom:7px}
.fn-l{font-size:11px;color:var(--muted)}
.fn-b{height:30px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;font-size:11px;font-weight:600;color:#04241a;transition:width .6s}
.fn-r{font-size:10.5px;color:var(--dim)}

/* heat */
.heat{border-collapse:separate;border-spacing:3px;table-layout:fixed}
.heat th{font-size:10px;color:var(--dim);font-weight:500;text-align:center;padding:0 0 3px;border:0}
.heat th:first-child{text-align:left;padding-left:2px}
.heat td{text-align:center;font-size:10.5px;font-weight:600;border-radius:5px;padding:7px 2px;border:0;
  font-variant-numeric:tabular-nums}
.heat tbody tr:hover td{outline:1px solid rgba(255,255,255,.22)}

/* legend */
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--muted)}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* feature cards */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fcard{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:12px;padding:14px;transition:.2s;position:relative;overflow:hidden;
  display:flex;flex-direction:column}
.fcard:hover{border-color:rgba(61,220,151,.35);transform:translateY(-2px)}
.fcard .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;
  background:rgba(61,220,151,.1);margin-bottom:9px}
.fcard h4{font-size:12.5px;font-weight:600;margin-bottom:4px}
.fcard p{font-size:10.8px;color:var(--dim);line-height:1.55;min-height:50px;flex:1}
.fcard .ft{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.mini{font-size:9.5px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--muted)}

/* misc */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px}
.kv div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv span{font-size:10px;color:var(--dim);display:block}
.kv b{font-size:15px;font-weight:640;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:4px 0 8px}
.cal i{height:26px;border-radius:3px;position:relative;display:block}
.cal-l{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:8.5px;color:var(--dim);text-align:center}
footer{max-width:1560px;margin:22px auto 0;padding:0 22px;font-size:10.5px;color:var(--dim);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media(max-width:1400px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .fgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:1080px){
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tabs button{padding:10px 11px;font-size:12px}
}
@media(max-width:700px){
  .wrap{padding:0 12px}
  .topbar{height:auto;flex-wrap:wrap;padding:10px 0;gap:9px}
  .brand h1{font-size:13.5px}
  .live{display:none}
  .spacer{display:none}
  .ctrl{width:100%;justify-content:space-between}
  .kpis{gap:8px;margin:12px 0 10px}
  .kpi{padding:10px 11px 9px;min-width:0}
  .kpi-h{min-width:0}
  .kpi-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi-v{font-size:19px}
  .chip{font-size:9.5px;padding:1px 5px}
  .spark{height:22px}
  .card{padding:12px 12px 11px}
  .fgrid{grid-template-columns:1fr}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .heat{display:table;white-space:normal}
}
</style>
</head>
<body>
<div class="bgfx"></div>

<header>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#04241a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 20h18"/><path d="M6 20V10l6-5 6 5v10"/><path d="M10 20v-5h4v5"/>
          </svg>
        </div>
        <div>
          <h1>土地乐 · CEO 驾驶舱</h1>
          <p>Agri-Input CEO Cockpit</p>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="ctrl">
        <span class="live"><i class="dot"></i>数据截至 2026-10-26 24:00</span>
        <select id="region"></select>
        <div class="seg" id="period">
          <button data-p="月">本月</button>
          <button data-p="季">本季度</button>
          <button data-p="年" class="on">本年度</button>
        </div>
        <div class="bell" title="5 条待处理预警">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9cb8ab" stroke-width="1.8" stroke-linecap="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
          <b>5</b>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="kpis" id="kpis"></section>

  <nav class="tabs" id="tabs">
    <button data-v="overview" class="on">经营总览</button>
    <button data-v="sales">销售作战</button>
    <button data-v="channel">渠道与客户</button>
    <button data-v="supply">供应链与库存</button>
    <button data-v="risk">风险与资金</button>
    <button data-v="insight">智能洞察 · 亮点功能</button>
  </nav>

  <main>
    <section class="grid view on" id="view-overview"></section>
    <section class="grid view" id="view-sales"></section>
    <section class="grid view" id="view-channel"></section>
    <section class="grid view" id="view-supply"></section>
    <section class="grid view" id="view-risk"></section>
    <section class="grid view" id="view-insight"></section>
  </main>
</div>

<footer>
  <span>演示原型 · 数据为模拟生成，用于功能与交互评审</span>
  <span>指标口径：ERP 出入库 / 经销商 APP 订单 / 扫码溯源 / 气象与期货行情</span>
</footer>

<script>
(function(){
  "use strict";

  /* ============ 工具 ============ */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function r2(x){return Math.round(x*100)/100}
  var fmt={
    money:function(v){return v>=10000?(v/10000).toFixed(2):String(Math.round(v))},
    wan:function(v){return v>=10000?(v/10000).toFixed(2)+"亿":Math.round(v)+"万"},
    pct:function(v){return v.toFixed(1)+"%"},
    int:function(v){return Math.round(v).toLocaleString("zh-CN")}
  };
  function bigNum(v){
    return v>=10000 ? {v:(v/10000).toFixed(2),u:"亿元"} : {v:fmt.int(v),u:"万元"};
  }
  function spark(vals,color,w,h){
    w=w||140;h=h||30;
    var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),rg=(mx-mn)||1;
    var pts=vals.map(function(v,i){return [i/(vals.length-1)*w, h-3-((v-mn)/rg)*(h-7)]});
    var line=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}).join(" ");
    var area=line+" L"+w+" "+h+" L0 "+h+" Z";
    var id="sg"+Math.floor(Math.random()*1e6);
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
      '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="'+color+'" stop-opacity=".32"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/>'+
      '</linearGradient></defs><path d="'+area+'" fill="url(#'+id+')"/>'+
      '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round"/></svg>';
  }

  /* ============ 常量 ============ */
  var REGIONS=["全国","华北","华东","华中","华南","西南","西北","东北"];
  var SCALE={"全国":86000,"华北":18600,"华东":21400,"华中":13800,"华南":8600,"西南":10200,"西北":6200,"东北":7200};
  var SEASON=[.55,.62,1.35,1.52,1.06,1.18,.94,.90,1.28,1.12,.78,.70];
  var CUR=9; // 10月
  var MONTHS=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  var CATS=[
    {n:"复合肥",c:"#3ddc97"},{n:"单质肥",c:"#57a9e6"},{n:"农药",c:"#e8b559"},
    {n:"种子",c:"#a58bfa"},{n:"农膜",c:"#54d4d0"},{n:"特肥/水溶肥",c:"#f0605d"}
  ];
  var CROPS=["小麦","玉米","水稻","大豆","棉花","蔬菜","果树","马铃薯"];
  var MATRIX=[
    [19,15,17,12,10,22],[20,16,18,14,12,23],[21,17,20,16,14,24],[18,14,16,13,11,21],
    [22,18,26,20,16,28],[25,21,32,24,22,33],[26,22,34,25,21,35],[23,19,27,22,18,29]
  ];

  /* ============ 数据构建 ============ */
  function buildData(region,period){
    var R=mulberry32(hash(region+"|"+period));
    function j(base,p){return base*(1+(R()*2-1)*p)}
    var scale=SCALE[region]||86000;
    var annualT=scale*1.06;

    var revenue=SEASON.map(function(s,i){ return j(scale/12*s,0.07) });
    var target=SEASON.map(function(s){ return annualT/12*s });
    var margin=SEASON.map(function(s,i){ return r2(j(18.4,0.06)+ (s>1.2?0.9:0) - i*0.04) });

    var idx={ "月":[CUR],"季":[7,8,9],"年":revenue.map(function(_,i){return i}) }[period];
    var revSum=idx.reduce(function(a,i){return a+revenue[i]},0);
    var tgtSum=idx.reduce(function(a,i){return a+target[i]},0);
    var marAvg=idx.reduce(function(a,i){return a+margin[i]},0)/idx.length;

    var R2=mulberry32(hash(region));
    function j2(base,p){return base*(1+(R2()*2-1)*p)}
    var collect=j2(86.4,0.05), turnover=j2(68,0.08), dealerCnt=j2(1284,0.06), fill=j2(96.2,0.015);
    var arTotal=scale*0.41, overdueRate=j2(9.8,0.18);

    var catPct=[38,16,22,12,5,7];
    if(region==="华东"){catPct=[33,14,27,12,4,10]}

  function combo(d){
    var W=760,H=248,L=48,R=42,T=14,B=26, iw=W-L-R, ih=H-T-B;
    var rev=d.revenue, mar=d.margin, tgt=d.target;
    var rmax=Math.max.apply(null,rev.concat(tgt))*1.14;
    var mmin=Math.min.apply(null,mar)-4, mmax=Math.max.apply(null,mar)+4;
    function x(i){return L+iw*(i+0.5)/rev.length}
    function y(v){return T+ih-(v/rmax)*ih}
    function ym(v){return T+ih-((v-mmin)/(mmax-mmin))*ih}
    var bw=iw/rev.length*0.44, s="";
    for(var g=0;g<=4;g++){
      var gy=T+ih-(ih*g/4), val=rmax*g/4;
      s+='<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+gy.toFixed(1)+'" stroke="rgba(255,255,255,.06)"/>';
      s+='<text x="'+(L-8)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="#718e80">'+
         Math.round(val).toLocaleString('zh-CN')+'</text>';
      s+='<text x="'+(W-R+8)+'" y="'+(gy+3.5).toFixed(1)+'" font-size="9.5" fill="#718e80">'+
         (mmin+(mmax-mmin)*g/4).toFixed(0)+'%</text>';
    }
    s+='<defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#3ddc97" stop-opacity=".95"/><stop offset="1" stop-color="#1f9d68" stop-opacity=".55"/></linearGradient></defs>';
    rev.forEach(function(v,i){
      var hgt=Math.max(1,T+ih-y(v));
      s+='<rect x="'+(x(i)-bw/2).toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+
         '" rx="2.5" fill="url(#bg1)" opacity="'+(i>CUR?.45:1)+'"><title>'+MONTHS[i]+' 营收 '+Math.round(v)+' 万</title></rect>';
      s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#718e80">'+MONTHS[i]+'</text>';
    });
    var tp=tgt.map(function(v,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)}).join(" ");
    s+='<path d="'+tp+'" fill="none" stroke="#e8b559" stroke-width="1.2" stroke-dasharray="4 4" opacity=".65"/>';
    var mp=mar.map(function(v,i){return (i?"L":"M")+x(i).toFixed(1)+" "+ym(v).toFixed(1)}).join(" ");
    s+='<path d="'+mp+'" fill="none" stroke="#57a9e6" stroke-width="2" stroke-linejoin="round"/>';
    mar.forEach(function(v,i){
      s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+ym(v).toFixed(1)+'" r="2.6" fill="#0f1c16" stroke="#57a9e6" stroke-width="1.6">'+
         '<title>'+MONTHS[i]+' 毛利率 '+v+'%</title></circle>';
    });
    s+='<text x="'+L+'" y="'+(T-2)+'" font-size="9.5" fill="#718e80">营收（柱 · 万元）· 毛利率（线 · %）· 目标（虚线）</text>';
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+s+'</svg>';
  }

  function donut(items,center,sub){
    var R=70,cx=110,cy=110,C=2*Math.PI*R,off=0,s="";

         'stroke-dasharray="'+(len-1.5).toFixed(2)+' '+(C-len+1.5).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" '+
         'transform="rotate(-90 '+cx+' '+cy+')" opacity=".92"><title>'+it.name+' '+it.pct.toFixed(1)+'%</title></circle>';
      off+=len;
    });
    s+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="22" font-weight="650" fill="#e9f2ec">'+center+'</text>';
    s+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="10" fill="#9cb8ab">'+sub+'</text>';
    return '<svg viewBox="0 0 220 220" width="100%" style="max-width:196px;display:block;margin:0 auto">'+s+'</svg>';

  function gauge(pct){
    var R=76,cx=110,cy=108, th=Math.PI*(1-Math.min(pct,100)/100);
    var ex=cx+R*Math.cos(th), ey=cy-R*Math.sin(th);
    var col=pct>95?"#f0605d":pct>85?"#e8b559":"#3ddc97";
    var s='<path d="M'+(cx-R)+' '+cy+' A '+R+' '+R+' 0 0 1 '+(cx+R)+' '+cy+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="13" stroke-linecap="round"/>';
    s+='<path d="M'+(cx-R)+' '+cy+' A '+R+' '+R+' 0 0 1 '+ex.toFixed(2)+' '+ey.toFixed(2)+'" fill="none" stroke="'+col+'" stroke-width="13" stroke-linecap="round"/>';
    s+='<text x="'+cx+'" y="'+(cy-24)+'" text-anchor="middle" font-size="25" font-weight="650" fill="'+col+'">'+pct.toFixed(0)+'%</text>';
    s+='<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" font-size="10" fill="#9cb8ab">信用额度使用</text>';
    s+='<text x="'+(cx-R+4)+'" y="'+(cy+18)+'" text-anchor="middle" font-size="9" fill="#718e80">0</text>';
    s+='<text x="'+(cx+R-4)+'" y="'+(cy+18)+'" text-anchor="middle" font-size="9" fill="#718e80">100</text>';
    return '<svg viewBox="0 0 220 138" width="100%" style="max-width:230px;display:block;margin:0 auto">'+s+'</svg>';
  }

  function funnel(steps){

        '<span style="font-size:11px;color:#9cb8ab">'+s.n+'</span>'+
        '<div class="fn-b" style="width:'+w.toFixed(1)+'%;background:linear-gradient(90deg,rgba(61,220,151,'+a+'),rgba(31,157,104,'+(a*0.6).toFixed(2)+'))">'+
        '<span>'+fmt.int(s.v)+'</span></div>'+
        (rate!==null?'<span style="font-size:10.5px;text-align:right;color:'+(rate<50?'#f0605d':rate<70?'#e8b559':'#3ddc97')+'">'+rate.toFixed(0)+'%</span>':'<span></span>')+

          '<div class="li-b"><div class="li-t">'+x[1]+'</div><div class="li-d">'+x[2]+'</div></div>'+
          '<div style="text-align:right"><div class="li-v" style="color:#3ddc97">+'+x[3]+'</div>'+
          '<div style="font-size:9.5px;color:#718e80">'+x[4]+'</div></div></div>'
      }).join("")+
      '<div class="foot"><span>建议合计可量化收益 <b style="color:#3ddc97">456 万</b> / 年，相当于毛利提升 0.9pt</span></div></div>'+

    '<div class="card c5"><div class="card-h"><div class="card-t"><i></i>落地路线</div><span class="card-s">12 周可上线一期</span></div>'+
      [["一期 · 0-2 月","数据底座 + 经营总览","打通 ERP/财务/CRM，统一口径，6 张高管看板","#3ddc97",100],
       ["二期 · 2-4 月","渠道 · 库存 · 风控","DHI 健康度、效期预警、赊销风控、窜货雷达","#e8b559",68],
       ["三期 · 4-6 月","预测与智能决策","农事日历预测、锁价建议、AI 建议闭环","#57a9e6",34]]
      .map(function(x){
        return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px">'+
          '<b style="color:'+x[3]+'">'+x[0]+'</b><span style="color:#718e80">'+x[1]+'</span></div>'+
          '<div class="hb-t" style="height:5px"><i style="width:'+x[4]+'%;background:'+x[3]+'"></i></div>'+
          '<div style="font-size:10.5px;color:#9cb8ab;margin-top:5px">'+x[2]+'</div></div>'
      }).join("")+
      '<div class="note">建议按「总览先行、风控立威、预测增值」的节奏推进，每一期都要能单独算清 ROI。</div></div>'+

    '<div class="card c12"><div class="card-h"><div class="card-t"><i></i>指标口径字典（节选）</div>'+
      '<span class="card-s">上线前先把这张表签掉，能省掉后面 80% 的争吵</span></div>'+
      '<table><thead><tr><th>指标</th><th>定义</th><th>数据源</th><th class="n">更新频率</th><th>责任人</th></tr></thead><tbody>'+
      [["销售收入","含税开票收入 − 退货 − 折让","ERP 销售出库","T+1","财务"],
       ["毛利率","(收入 − 成本) / 收入，成本含运费与损耗","财务总账","月结","财务"],
       ["回款率","本期回款 / 本期应收发生额","资金系统","T+1","财务 + 销售"],
       ["库存周转天数","平均库存成本 / 日均出库成本","WMS 批次","实时","供应链"],
       ["经销商健康分","回款 40% + 动销 25% + 库存 20% + 合规 15%","DHI 模型","周","渠道部"],
       ["临期占比","剩余效期 &lt; 90 天库存 / 总库存","WMS 批次","实时","供应链"]]
      .map(function(r){
        return '<tr><td><b>'+r[0]+'</b></td><td style="color:#9cb8ab">'+r[1]+'</td>'+
          '<td style="color:#718e80">'+r[2]+'</td><td class="n">'+r[3]+'</td><td>'+r[4]+'</td></tr>';
      }).join("")+'</tbody></table></div>';
  }

  var VIEWS={overview:viewOverview,sales:viewSales,channel:viewChannel,supply:viewSupply,risk:viewRisk,insight:viewInsight};

  /* ============ 应用 ============ */
  var state={region:"全国",period:"年"};

  function kpisHTML(d){
    return d.kpis.map(function(k){
      var cls=k.good?"up":"down";
      var arrow=k.dir==="up"?"▲":k.dir==="down"?"▼":"—";
      var accent=k.good?"#3ddc97":"#e8b559";
      return '<div class="kpi" style="--ac:'+accent+'"><div class="kpi-h"><span class="kpi-l">'+k.l+'</span>'+
        '<span class="chip '+cls+'">'+arrow+' '+Math.abs(k.d)+'%</span></div>'+
        '<div class="kpi-v num">'+k.v+'<em>'+k.u+'</em></div>'+
        spark(k.sp,k.c,140,28)+
        '<div class="kpi-f"><span class="kpi-n">'+k.n+'</span></div></div>';
    }).join("");
  }

  function render(){
    var d=buildData(state.region,state.period);
    document.getElementById("kpis").innerHTML=kpisHTML(d);
    Object.keys(VIEWS).forEach(function(id){
      document.getElementById("view-"+id).innerHTML=VIEWS[id](d);
    });
  }

  function setView(id){
    [].forEach.call(document.querySelectorAll("#tabs button"),function(x){x.classList.toggle("on",x.dataset.v===id)});
    [].forEach.call(document.querySelectorAll(".view"),function(v){v.classList.toggle("on",v.id==="view-"+id)});
  }

  function init(){
    var sel=document.getElementById("region");
    sel.innerHTML=REGIONS.map(function(r){return '<option'+(r===state.region?" selected":"")+'>'+r+'</option>'}).join("");
    sel.addEventListener("change",function(){state.region=sel.value;render()});

    document.getElementById("period").addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b)return;
      state.period=b.dataset.p;
      [].forEach.call(this.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b)});
      render();
    });

    document.getElementById("tabs").addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b)return;
      setView(b.dataset.v);
      try{ history.replaceState(null,"","#"+b.dataset.v); }catch(err){ location.hash=b.dataset.v; }
      window.scrollTo({top:0,behavior:"smooth"});
    });

    var h=(location.hash||"").replace("#","");
    if(h&&document.getElementById("view-"+h)) setView(h);
    render();
  }

  document.addEventListener("DOMContentLoaded",init);

  /* 供自动化冒烟测试 */
  window.__COCKPIT={
    buildData:buildData,
    views:VIEWS,
    kpisHTML:kpisHTML,
    selftest:function(){
      var out=[];
      REGIONS.forEach(function(r){
        ["月","季","年"].forEach(function(p){
          var d=buildData(r,p);
          var all=[kpisHTML(d)].concat(Object.keys(VIEWS).map(function(k){return VIEWS[k](d)}));
          all.forEach(function(html,i){
            if(!html||html.indexOf("undefined")>-1||html.indexOf("NaN")>-1){
              throw new Error("bad render: "+r+"/"+p+"/"+i);
            }
          });
          out.push(r+"/"+p);
        });
      });
      return out;
    }
  };
})();
</script>
</body>
</html>
