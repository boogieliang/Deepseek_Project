<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沃野智控 · 农资经营系统（MVP）</title>
<style>
:root{
  --bg:#08120e; --panel:#0f1c16; --panel2:#13241c; --line:rgba(255,255,255,.075);
  --text:#e9f2ec; --muted:#9cb8ab; --dim:#718e80;
  --green:#3ddc97; --gold:#e8b559; --red:#f0605d; --blue:#57a9e6; --violet:#a58bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:30px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 420px at 12% -8%,rgba(61,220,151,.13),transparent 62%),
             radial-gradient(760px 380px at 88% -12%,rgba(232,181,89,.10),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:0 22px}
.num{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(8,18,14,.95),rgba(8,18,14,.72));border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2ec98a,#0f7a52);box-shadow:0 4px 16px rgba(46,201,138,.28)}
.brand h1{font-size:15px;font-weight:650;letter-spacing:.03em;line-height:1.2}
.brand p{font-size:9.5px;color:var(--dim);letter-spacing:.2em}
.spacer{flex:1}
.badge{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);
  border:1px solid var(--line);background:rgba(255,255,255,.03);padding:4px 9px;border-radius:20px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.btn{border:0;cursor:pointer;font:inherit;font-size:12.5px;padding:8px 14px;border-radius:9px;
  background:linear-gradient(145deg,#2ec98a,#159a66);color:#04241a;font-weight:650;transition:.18s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.danger{background:rgba(240,96,93,.14);color:var(--red);border:1px solid rgba(240,96,93,.3)}
select,input,textarea{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);
  font:inherit;font-size:12px;padding:7px 10px;border-radius:8px;outline:none;width:100%}
select:focus,input:focus,textarea:focus{border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.05)}
label{font-size:10.5px;color:var(--dim);display:block;margin-bottom:4px}

/* filter */
.filters{display:flex;align-items:center;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:5px 13px;
  border-radius:7px;cursor:pointer;transition:.18s}
.seg button.on{background:rgba(61,220,151,.16);color:var(--green);box-shadow:inset 0 0 0 1px rgba(61,220,151,.3)}
.hint{font-size:10.5px;color:var(--dim)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{position:relative;background:linear-gradient(170deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:13px 15px;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--ac,#3ddc97)}
.kpi-l{font-size:11.5px;color:var(--muted)}
.kpi-v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:4px 0 0;display:flex;align-items:baseline;gap:4px}
.kpi-v em{font-size:11.5px;font-weight:400;color:var(--muted);font-style:normal}
.kpi-f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10.5px;color:var(--dim)}
.chip{font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600}
.up{color:var(--green);background:rgba(61,220,151,.13)}
.down{color:var(--red);background:rgba(240,96,93,.13)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px;align-items:start}
.card{background:linear-gradient(178deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.card-t i{width:3px;height:12px;border-radius:2px;background:var(--green);display:inline-block}
.card-s{font-size:10.5px;color:var(--dim)}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

/* suggestions */
.sg{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sg:last-child{border:0;padding-bottom:0}
.pill{font-size:9.5px;padding:2px 7px;border-radius:20px;font-weight:700;flex:none;height:19px}
.p0{color:var(--red);background:rgba(240,96,93,.14)}
.p1{color:var(--gold);background:rgba(232,181,89,.14)}
.p2{color:var(--blue);background:rgba(87,169,230,.14)}
.sg-b{flex:1;min-width:0}
.sg-t{font-size:12px;font-weight:550;color:#dfeae4}
.sg-e{font-size:10.5px;color:var(--dim);margin-top:2px}
.sg-a{font-size:10.5px;color:#9cb8ab;margin-top:3px}
.sg-a b{color:var(--green);font-weight:600}
.sg-i{text-align:right;white-space:nowrap}
.sg-i b{font-size:12px;color:var(--green);font-variant-numeric:tabular-nums}
.sg-i span{display:block;font-size:9.5px;color:var(--dim)}

/* bars */
.hb{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:9px;margin-bottom:9px;font-size:11.5px}
.hb-n{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{height:7px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:4px}
.hb-v{font-variant-numeric:tabular-nums;font-weight:600;font-size:11px;min-width:52px;text-align:right}

/* table */
.tw{overflow:auto;max-height:430px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{position:sticky;top:0;background:#13241c;text-align:left;font-weight:500;color:var(--dim);font-size:10.5px;
  padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);color:#cfdcd5;white-space:nowrap}
tbody tr:hover td{background:rgba(61,220,151,.05)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:10.5px;
  padding:2px 8px;border-radius:6px;cursor:pointer;margin-right:5px}
.mini:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.mini.del:hover{color:var(--red);border-color:rgba(240,96,93,.4)}

/* drawer */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);z-index:60;display:none}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:-460px;width:440px;max-width:92vw;height:100%;z-index:70;
  background:linear-gradient(180deg,#12211a,#0c1711);border-left:1px solid var(--line);
  transition:right .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.on{right:0}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dr-h h3{font-size:14px;font-weight:600}
.dr-b{flex:1;overflow:auto;padding:16px 18px}
.dr-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.close{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:90;
  background:#153126;border:1px solid rgba(61,220,151,.35);color:var(--text);padding:10px 18px;
  border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(240,96,93,.45);background:#2a1513}
.flow{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);margin-top:6px}
.flow b{color:var(--muted);font-weight:500}
@media(max-width:1100px){
  .c4,.c5,.c7,.c8{grid-column:span 12}
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:700px){
  .wrap{padding:0 12px}.kpis{grid-template-columns:repeat(2,1fr)}
  .bar{height:auto;flex-wrap:wrap;padding:10px 0}
}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <div class="logo">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#04241a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20h18"/><path d="M6 20V10l6-5 6 5v10"/><path d="M10 20v-5h4v5"/>
        </svg>
      </div>
      <div><h1>沃野智控 · 农资经营系统</h1><p>AGRI OPS · MVP</p></div>
    </div>
    <div class="spacer"></div>
    <span class="badge"><i class="dot"></i><span id="status">已连接数据库</span></span>
    <button class="btn ghost" id="refresh">刷新</button>
    <button class="btn" id="addBtn">＋ 填报周报</button>
  </div>
</header>

<div class="wrap">
  <div class="filters">
    <select id="region" style="width:120px"></select>
    <div class="seg" id="period">
      <button data-p="周">本周</button>
      <button data-p="4周" class="on">近 4 周</button>
      <button data-p="年">全周期</button>
    </div>
    <span class="hint" id="range"></span>
    <div class="spacer"></div>
    <span class="hint">填报 → 入库 → 重算 → 建议，全链路实时更新</span>
  </div>

  <section class="kpis" id="kpis"></section>

  <div class="grid">
    <div class="card c8">
      <div class="card-h"><div class="card-t"><i></i>周度营收与毛利</div><span class="card-s" id="chartSub">最近 12 周</span></div>
      <div id="chart"></div>
      <div class="flow"><b>数据流</b><span>周报入库</span><span>→</span><span>指标聚合</span><span>→</span><span>规则引擎</span><span>→</span><span>页面刷新</span></div>
    </div>

    <div class="card c4">
      <div class="card-h"><div class="card-t"><i></i>系统建议</div><span class="card-s" id="sgCount"></span></div>
      <div id="suggestions"></div>
    </div>

    <div class="card c5">
      <div class="card-h"><div class="card-t"><i></i>品类结构</div><span class="card-s">按收入占比</span></div>
      <div id="cats"></div>
    </div>

    <div class="card c7">
      <div class="card-h"><div class="card-t"><i></i>大区完成率</div><span class="card-s">目标达成 · 回款</span></div>
      <div id="regions"></div>
    </div>

    <div class="card c12">
      <div class="card-h"><div class="card-t"><i></i>周报填报记录</div>
        <span class="card-s">点击「编辑」修改数据，保存后所有指标与建议立即重算</span></div>
      <div class="tw"><table id="recent"></table></div>
    </div>
  </div>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="dr-h"><h3 id="drTitle">填报周报</h3><button class="close" id="drClose">×</button></div>
  <div class="dr-b">
    <div class="f2">
      <div><label>周次</label><select id="f-week"></select></div>
      <div><label>大区</label><select id="f-region"></select></div>
      <div><label>品类</label><select id="f-category"></select></div>
      <div><label>销售收入（万元）</label><input id="f-revenue" type="number" step="0.1" value="0"></div>
      <div><label>目标（万元）</label><input id="f-target" type="number" step="0.1" value="0"></div>
      <div><label>毛利率（%）</label><input id="f-gross_margin" type="number" step="0.1" value="18"></div>
      <div><label>回款率（%）</label><input id="f-collect_rate" type="number" step="0.1" value="88"></div>
      <div><label>库存周转（天）</label><input id="f-inventory_days" type="number" step="1" value="60"></div>
      <div><label>应收余额（万元）</label><input id="f-receivable" type="number" step="0.1" value="0"></div>
      <div><label>临期金额（万元）</label><input id="f-expiring" type="number" step="0.1" value="0"></div>
      <div><label>订单数</label><input id="f-orders" type="number" step="1" value="0"></div>
      <div><label>履约率（%）</label><input id="f-fill_rate" type="number" step="0.1" value="96"></div>
      <div><label>填报人</label><input id="f-owner" type="text" value="李财务"></div>
      <div><label>备注</label><input id="f-note" type="text" placeholder="如：竞品降价 / 断货"></div>
    </div>
    <p class="hint" style="margin-top:4px">同一「周次 + 大区 + 品类」再次提交将覆盖原记录（幂等 upsert），并写入审计日志。</p>
  </div>
  <div class="dr-f">
    <button class="btn ghost" id="drCancel">取消</button>
    <button class="btn danger" id="drDelete" style="display:none;margin-right:auto">删除</button>
    <button class="btn" id="drSave">保存并重算</button>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var state={region:"全国",period:"4周"}, META=null, EDIT=null;

  function $(s){return document.querySelector(s)}
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
  function fmt(n,d){n=Number(n)||0;return n.toLocaleString("zh-CN",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
  function toast(msg,err){
    var t=$("#toast"); t.textContent=msg; t.className="toast on"+(err?" err":"");
    clearTimeout(t._t); t._t=setTimeout(function(){t.className="toast"+(err?" err":"")},2600);
  }

  /* ---------- 图表 ---------- */
  function nice(v){
    if(v<=0) return 1;
    var p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
    var m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
    return m*p;
  }
  function chart(series){
    var W=900,H=260,L=56,R=46,T=16,B=30, iw=W-L-R, ih=H-T-B;
    if(!series.length) return '<div class="hint">暂无数据</div>';
    var rawMax=Math.max.apply(null,series.map(function(s){return Math.max(s.revenue,s.target)}))||1;
    var maxRev=nice(rawMax/4)*4;
    var mms=series.map(function(s){return s.margin}), mn=Math.min.apply(null,mms)-3, mx=Math.max.apply(null,mms)+3;
    function X(i){return L+iw*(i+0.5)/series.length}
    function Y(v){return T+ih-(v/maxRev)*ih}
    function YM(v){return T+ih-((v-mn)/((mx-mn)||1))*ih}
    var s="", bw=iw/series.length*0.42;
    for(var g=0;g<=4;g++){
      var gy=T+ih-ih*g/4;
      s+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="rgba(255,255,255,.06)"/>';
      s+='<text x="'+(L-8)+'" y="'+(gy+3.5)+'" text-anchor="end" font-size="9.5" fill="#718e80">'+Math.round(maxRev*g/4)+'</text>';
      s+='<text x="'+(W-R+8)+'" y="'+(gy+3.5)+'" font-size="9.5" fill="#718e80">'+(mn+(mx-mn)*g/4).toFixed(0)+'%</text>';
    }
    s+='<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ddc97" stop-opacity=".95"/><stop offset="1" stop-color="#1f9d68" stop-opacity=".5"/></linearGradient></defs>';
    series.forEach(function(d,i){
      var y=Y(d.revenue), h=Math.max(1,T+ih-y);
      s+='<rect x="'+(X(i)-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="2.5" fill="url(#bg)"><title>'+d.week+' 收入 '+d.revenue+' 万</title></rect>';
      s+='<text x="'+X(i)+'" y="'+(H-9)+'" text-anchor="middle" font-size="9" fill="#718e80">'+d.week.slice(5)+'</text>';
    });
    s+='<path d="'+series.map(function(d,i){return (i?"L":"M")+X(i)+" "+Y(d.target)}).join(" ")+
       '" fill="none" stroke="#e8b559" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/>';
    s+='<path d="'+series.map(function(d,i){return (i?"L":"M")+X(i)+" "+YM(d.margin)}).join(" ")+
       '" fill="none" stroke="#57a9e6" stroke-width="2"/>';
    series.forEach(function(d,i){
      s+='<circle cx="'+X(i)+'" cy="'+YM(d.margin)+'" r="2.6" fill="#0f1c16" stroke="#57a9e6" stroke-width="1.6"><title>毛利率 '+d.margin+'%</title></circle>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+s+'</svg>';
  }

  /* ---------- 渲染 ---------- */
  function renderKPI(k){
    return k.map(function(x){
      var cls=x.good?"up":"down", arrow=x.delta>=0?"▲":"▼";
      var ac=x.good?"#3ddc97":"#e8b559";
      return '<div class="kpi" style="--ac:'+ac+'"><div class="kpi-l">'+x.label+'</div>'+
        '<div class="kpi-v num">'+fmt(x.value,1)+'<em>'+x.unit+'</em></div>'+
        '<div class="kpi-f"><span>'+x.note+'</span>'+
        '<span class="chip '+cls+'">'+arrow+' '+Math.abs(x.delta)+'</span></div></div>';
    }).join("");
  }

  function renderTips(list){
    if(!list.length) return '<div class="hint" style="padding:20px 0;text-align:center">所有指标在阈值内，暂无建议</div>';
    return list.map(function(t){
      var cls=t.level==="P0"?"p0":t.level==="P1"?"p1":"p2";
      return '<div class="sg"><span class="pill '+cls+'">'+t.level+'</span>'+
        '<div class="sg-b"><div class="sg-t">'+t.title+'</div>'+
        '<div class="sg-e">'+t.evidence+'</div>'+
        '<div class="sg-a">建议：'+t.action+'</div></div>'+
        '<div class="sg-i"><b>'+t.impact+'</b><span>'+t.module+'</span></div></div>';
    }).join("");
  }

  function renderCats(list){
    if(!list.length) return "";
    var mx=Math.max.apply(null,list.map(function(c){return c.share}))||1;
    return list.map(function(c){
      return '<div class="hb"><span class="hb-n">'+c.name+'</span>'+
        '<span class="hb-t"><i style="width:'+(c.share/mx*100)+'%;background:linear-gradient(90deg,#3ddc97,rgba(61,220,151,.25))"></i></span>'+
        '<span class="hb-v">'+c.share+'% · '+c.margin+'%</span></div>';
    }).join("");
  }

  function renderRegions(list){
    if(!list.length) return "";
    var maxDev=Math.max(6,Math.max.apply(null,list.map(function(r){return Math.abs(r.rate-100)})));
    var rows=list.map(function(r){
      var dev=r.rate-100, w=Math.min(48,Math.abs(dev)/maxDev*48);
      var col=r.rate>=100?"#3ddc97":r.rate>=93?"#e8b559":"#f0605d";
      var left=dev>=0?50:50-w;
      return '<div style="display:grid;grid-template-columns:60px 1fr 50px 50px;gap:10px;align-items:center;margin-bottom:9px">'+
        '<span class="hb-n">'+r.name+'</span>'+
        '<span style="position:relative;height:9px;background:rgba(255,255,255,.05);border-radius:4px;display:block">'+
          '<i style="position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:rgba(255,255,255,.28)"></i>'+
          '<i style="position:absolute;top:0;bottom:0;left:'+left.toFixed(1)+'%;width:'+w.toFixed(1)+'%;background:'+col+';border-radius:3px;display:block"></i>'+
        '</span>'+
        '<span class="hb-v" style="color:'+col+'">'+r.rate+'%</span>'+
        '<span class="hb-v" style="color:'+(r.collect<88?"#f0605d":"#9cb8ab")+'">'+r.collect+'%</span></div>';
    }).join("");
    var head='<div style="display:grid;grid-template-columns:60px 1fr 50px 50px;gap:10px;font-size:9.5px;color:#718e80;margin-bottom:7px">'+
      '<span>大区</span><span style="text-align:center">← 缺口　｜　达标线　｜　超额 →</span>'+
      '<span style="text-align:right">完成率</span><span style="text-align:right">回款率</span></div>';
    return head+rows;
  }

  function renderTable(rows){
    var head='<thead><tr><th>周次</th><th>大区</th><th>品类</th><th class="n">收入(万)</th><th class="n">目标(万)</th>'+
      '<th class="n">毛利率</th><th class="n">回款率</th><th class="n">周转</th><th class="n">临期(万)</th><th>填报人</th><th>操作</th></tr></thead>';
    var body=rows.map(function(r){
      return '<tr><td>'+r.week+'</td><td>'+r.region+'</td><td>'+r.category+'</td>'+
        '<td class="n">'+fmt(r.revenue,1)+'</td><td class="n">'+fmt(r.target,1)+'</td>'+
        '<td class="n">'+r.gross_margin+'%</td><td class="n" style="color:'+(r.collect_rate<88?"#f0605d":"#cfdcd5")+'">'+r.collect_rate+'%</td>'+
        '<td class="n">'+Math.round(r.inventory_days)+'</td><td class="n">'+fmt(r.expiring,1)+'</td>'+
        '<td>'+r.owner+'</td>'+
        '<td><button class="mini" data-edit="'+r.id+'">编辑</button><button class="mini del" data-del="'+r.id+'">删除</button></td></tr>';
    }).join("");
    return head+'<tbody>'+body+'</tbody>';
  }

  /* ---------- 数据 ---------- */
  function load(){
    var q="/api/state?region="+encodeURIComponent(state.region)+"&period="+encodeURIComponent(state.period);
    return fetch(q).then(function(r){return r.json()}).then(function(d){
      if(d.empty){toast("暂无数据",true);return}
      window.DATA=d;
      $("#kpis").innerHTML=renderKPI(d.kpis);
      $("#chart").innerHTML=chart(d.series);
      $("#suggestions").innerHTML=renderTips(d.suggestions);
      $("#sgCount").textContent=d.suggestions.length+" 条建议";
      $("#cats").innerHTML=renderCats(d.categories);
      $("#regions").innerHTML=renderRegions(d.regions);
      $("#recent").innerHTML=renderTable(d.recent);
      $("#range").textContent="统计区间 "+(d.range[0]||"")+" ~ "+(d.range[1]||"")+" · 非全国口径为单大区";
      $("#status").textContent="已连接 · "+(d.updated_at||"");
    }).catch(function(e){toast("加载失败："+e.message,true)});
  }

  function fillForm(row){
    EDIT=row||null;
    $("#drTitle").textContent=row?"编辑填报":"填报周报";
    $("#drDelete").style.display=row?"inline-block":"none";
    $("#f-week").value=row?row.week:(META.weeks[META.weeks.length-1]||"");
    $("#f-region").value=row?row.region:"华北";
    $("#f-category").value=row?row.category:"复合肥";
    var v=function(id,val){$("#"+id).value=val==null?"":val};
    v("f-revenue",row?row.revenue:0); v("f-target",row?row.target:0);
    v("f-gross_margin",row?row.gross_margin:18); v("f-collect_rate",row?row.collect_rate:88);
    v("f-inventory_days",row?row.inventory_days:60); v("f-receivable",row?row.receivable:0);
    v("f-expiring",row?row.expiring:0); v("f-orders",row?row.orders:0);
    v("f-fill_rate",row?row.fill_rate:96); v("f-owner",row?row.owner:"李财务");
    v("f-note",row?row.note:"");
    $("#mask").classList.add("on"); $("#drawer").classList.add("on");
  }
  function closeDrawer(){$("#mask").classList.remove("on");$("#drawer").classList.remove("on");EDIT=null}

  function save(){
    var d={
      week:$("#f-week").value, region:$("#f-region").value, category:$("#f-category").value,
      revenue:$("#f-revenue").value, target:$("#f-target").value,
      gross_margin:$("#f-gross_margin").value, collect_rate:$("#f-collect_rate").value,
      inventory_days:$("#f-inventory_days").value, receivable:$("#f-receivable").value,
      expiring:$("#f-expiring").value, orders:$("#f-orders").value, fill_rate:$("#f-fill_rate").value,
      owner:$("#f-owner").value, note:$("#f-note").value
    };
    fetch("/api/weekly",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})
      .then(function(r){return r.json()}).then(function(r){
        if(r.error){toast("保存失败："+r.error,true);return}
        closeDrawer(); toast("已保存 · 指标与建议已重算"); load();
      }).catch(function(e){toast("保存失败："+e.message,true)});
  }

  function del(id){
    if(!confirm("确认删除这条周报记录？删除后所有指标会立即重算。"))return;
    fetch("/api/weekly/"+id,{method:"DELETE"}).then(function(r){return r.json()}).then(function(r){
      if(r.error){toast("删除失败："+r.error,true);return}
      closeDrawer(); toast("已删除"); load();
    });
  }

  function bind(){
    $("#region").addEventListener("change",function(){state.region=this.value;load()});
    $("#period").addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b)return;
      state.period=b.dataset.p;
      [].forEach.call(this.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b)});
      load();
    });
    $("#refresh").addEventListener("click",function(){load();toast("已刷新")});
    $("#addBtn").addEventListener("click",function(){fillForm(null)});
    $("#drClose").addEventListener("click",closeDrawer);
    $("#drCancel").addEventListener("click",closeDrawer);
    $("#mask").addEventListener("click",closeDrawer);
    $("#drSave").addEventListener("click",save);
    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer()});
    $("#recent").addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b)return;
      if(b.dataset.del){ del(b.dataset.del); return; }
      var id=b.dataset.edit;
      var row=(window.DATA.recent||[]).filter(function(r){return String(r.id)===id})[0];
      if(row) fillForm(row);
    });
    $("#drDelete").addEventListener("click",function(){ if(EDIT) del(EDIT.id); });
  }

  function boot(){
    fetch("/api/meta").then(function(r){return r.json()}).then(function(m){
      META=m;
      $("#region").innerHTML=['全国'].concat(m.regions).map(function(r){
        return '<option'+(r===state.region?" selected":"")+'>'+r+'</option>'}).join("");
      $("#f-week").innerHTML=m.weeks.map(function(w){return '<option>'+w+'</option>'}).join("");
      $("#f-region").innerHTML=m.regions.map(function(w){return '<option>'+w+'</option>'}).join("");
      $("#f-category").innerHTML=m.categories.map(function(w){return '<option>'+w+'</option>'}).join("");
      bind(); load();
    }).catch(function(e){
      document.body.insertAdjacentHTML("afterbegin",
        '<div style="padding:40px;color:#f0605d">无法连接后端：请先运行 python server.py 后访问 http://127.0.0.1:8787</div>');
    });
  }

  boot();
})();
</script>
</body>
</html>
